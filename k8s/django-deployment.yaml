apiVersion: apps/v1
kind: Deployment
metadata:
  name: django
  namespace: takecare
spec:
  replicas: 1
  selector:
    matchLabels:
      app: django
  template:
    metadata:
      labels:
        app: django
    spec:
      initContainers:
        - name: migrate
          image: stenythomas/takecare-app:1
          command:
            - python
            - manage.py
            - migrate
            - --noinput
          envFrom:
            - configMapRef:
                name: takecare-config
            - secretRef:
                name: takecare-secret

      containers:
        - name: django
          image: stenythomas/takecare-app:1
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8000

          envFrom:
            - configMapRef:
                name: takecare-config
            - secretRef:
                name: takecare-secret

          command:
            - sh
            - -c
            - |
              python manage.py collectstatic --noinput &&
              exec gunicorn \
                --bind 0.0.0.0:8000 \
                --workers 2 \
                --timeout 120 \
                takecare.wsgi:application

          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"

          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5

          volumeMounts:
            - name: static-storage
              mountPath: /app/staticfiles
            - name: media-storage
              mountPath: /app/media

      volumes:
        - name: static-storage
          persistentVolumeClaim:
            claimName: static-pvc
        - name: media-storage
          persistentVolumeClaim:
            claimName: media-pvc
